<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b7285">
<title>水温モニター</title>
<style>
body{margin:0;background:#eef7f8;color:#17323a;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px 16px 36px}
h1{text-align:center;font-size:30px;margin:8px 0 22px}
.card{background:white;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.label{text-align:center;opacity:.7}.temp{text-align:center;font-size:64px;font-weight:700;margin:5px 0}.unit{font-size:25px;font-weight:500}
.status,.updated{text-align:center;font-size:14px;margin-top:10px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ca25f;margin-right:7px}
.stats{display:flex;gap:10px;margin-top:18px}.stat{flex:1;text-align:center;background:#f3f8f9;border-radius:14px;padding:12px}.stat small{display:block;opacity:.65}.stat strong{font-size:20px}
.chart-title{font-size:18px;font-weight:700;margin-bottom:4px}.chart-subtitle{text-align:right;font-size:12px;opacity:.55;margin-bottom:4px}#chart{width:100%;height:300px}
.footer{text-align:center;font-size:12px;opacity:.55}
</style>
</head>
<body>
<div class="wrap">
<h1>🌡 水温モニター</h1>
<div class="card">
<div class="label">現在の水温</div>
<div class="temp"><span id="temp">--.--</span> <span class="unit">℃</span></div>
<div class="status"><span class="dot" id="dot"></span><span id="status">データ取得中…</span></div>
<div class="updated" id="updated">--</div>
<div class="stats">
<div class="stat"><small>48時間の最高</small><strong id="max">--.-- ℃</strong></div>
<div class="stat"><small>48時間の最低</small><strong id="min">--.-- ℃</strong></div>
</div>
</div>
<div class="card">
<div class="chart-title">水温の推移（過去48時間）</div>
<div class="chart-subtitle">30分ごとの平均値</div>
<svg id="chart" viewBox="0 0 700 300" preserveAspectRatio="none"></svg>
</div>
<div class="footer">ThingSpeak Channel 3491588 ・ 15秒ごとに更新</div>
</div>
<script>
const API="https://api.thingspeak.com/channels/3491588/feeds.json?results=8000";
const MIN_TEMP=5, MAX_TEMP=30;
const HALF_HOUR=30*60*1000, RANGE=48*60*60*1000;

function make30MinData(feeds){
  const now=Date.now(), start=now-RANGE, buckets=new Map();
  feeds.forEach(f=>{
    const t=new Date(f.created_at).getTime(), v=+f.field1;
    if(!Number.isFinite(t)||!Number.isFinite(v)||t<start||t>now)return;
    const bucket=Math.floor(t/HALF_HOUR)*HALF_HOUR;
    if(!buckets.has(bucket))buckets.set(bucket,[]);
    buckets.get(bucket).push(v);
  });
  return [...buckets.entries()].sort((a,b)=>a[0]-b[0]).map(([t,vs])=>({t,v:vs.reduce((a,b)=>a+b,0)/vs.length}));
}

function draw(points){
  const svg=document.getElementById("chart"); svg.innerHTML="";
  if(!points.length)return;
  const W=700,H=300,L=55,R=18,T=18,B=42, now=Date.now(), start=now-RANGE;
  const x=t=>L+(W-L-R)*((t-start)/RANGE);
  const y=v=>T+(H-T-B)*(1-(v-MIN_TEMP)/(MAX_TEMP-MIN_TEMP));

  for(let i=0;i<=5;i++){
    const value=MAX_TEMP-(MAX_TEMP-MIN_TEMP)*i/5, yy=y(value);
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",L);ln.setAttribute("x2",W-R);ln.setAttribute("y1",yy);ln.setAttribute("y2",yy);ln.setAttribute("stroke","#d9e5e8");svg.appendChild(ln);
    const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x",L-8);tx.setAttribute("y",yy+5);tx.setAttribute("text-anchor","end");tx.setAttribute("font-size","13");tx.setAttribute("fill","#61747a");tx.textContent=value.toFixed(0);svg.appendChild(tx);
  }

  let d="";
  points.forEach((p,i)=>d+=(i?" L ":"M ")+x(p.t)+" "+y(p.v));
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",d);path.setAttribute("fill","none");path.setAttribute("stroke","#0b7285");path.setAttribute("stroke-width","4");path.setAttribute("stroke-linecap","round");path.setAttribute("stroke-linejoin","round");svg.appendChild(path);

  points.forEach(p=>{
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x(p.t));c.setAttribute("cy",y(p.v));c.setAttribute("r","3.5");c.setAttribute("fill","#0b7285");svg.appendChild(c);
  });

  for(let i=0;i<=6;i++){
    const t=start+i*(RANGE/6), xx=x(t);
    const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    tx.setAttribute("x",xx);tx.setAttribute("y",H-12);tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","11");tx.setAttribute("fill","#61747a");
    tx.textContent=new Date(t).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});svg.appendChild(tx);
  }
}

async function update(){
  try{
    const r=await fetch(API,{cache:"no-store"}); if(!r.ok)throw Error(r.status);
    const d=await r.json(), f=d.feeds||[]; if(!f.length)throw Error("no data");
    const latest=+f[f.length-1].field1;
    const recent=f.filter(item=>{const t=new Date(item.created_at).getTime();return Number.isFinite(t)&&t>=Date.now()-RANGE;});
    const vals=recent.map(x=>+x.field1).filter(Number.isFinite);
    document.getElementById("temp").textContent=latest.toFixed(2);
    document.getElementById("max").textContent=(vals.length?Math.max(...vals):latest).toFixed(2)+" ℃";
    document.getElementById("min").textContent=(vals.length?Math.min(...vals):latest).toFixed(2)+" ℃";
    document.getElementById("updated").textContent="最終更新："+new Date(f[f.length-1].created_at).toLocaleString("ja-JP");
    document.getElementById("status").textContent="正常に監視中"; document.getElementById("dot").style.background="#2ca25f";
    draw(make30MinData(f));
  }catch(e){
    document.getElementById("status").textContent="データ取得エラー"; document.getElementById("dot").style.background="#d64545"; console.error(e);
  }
}
update(); setInterval(update,15000);
</script>
</body>
</html>
